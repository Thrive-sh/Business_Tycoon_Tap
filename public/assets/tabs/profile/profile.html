    <!-- MODAL KONFIRMASI DUA LANGKAH: RESET SEMUA DATA -->
    <div class="modal-backdrop" id="reset-modal" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title" hidden>
      <div class="modal-dialog">
        <h2 class="modal-dialog__title" id="reset-modal-title">Reset Semua Data?</h2>
        <p class="modal-dialog__body">
          Tindakan ini akan menghapus seluruh saldo, tingkat peningkatan, dan riwayat statistik secara permanen.
        </p>
        <label class="reset-confirm-check" for="reset-confirm-checkbox">
          <input type="checkbox" id="reset-confirm-checkbox">
          <span>Saya mengerti seluruh progres akan dihapus dan tidak dapat dikembalikan.</span>
        </label>
        <div class="modal-dialog__actions">
          <button type="button" class="preview-card__btn preview-card__btn--secondary" id="cancel-reset-btn">Batal</button>
          <button type="button" class="danger-btn danger-btn--solid" id="confirm-reset-btn" disabled>Hapus Permanen</button>
        </div>
      </div>
    </div>
